# Single-node synchronous PPO using the settings recorded in logs/ppo-8gpu-b48.
# Output directories are separate from the original experiment.
defaults:
  - train_qwen3.5_4b_libero_rl_ppo
  - _self_

cluster:
  num_nodes: 1
  component_placement:
    # Six learner GPUs: actor/critic TP=2, DP=3; six SGLang TP=1 replicas.
    actor: 0-5
    critic: 0-5
    rollout: 0-5
    reward: 0-5
    # Six CPU agent workers; LIBERO GPU placement is set by env_gpus below.
    agentloop:
      node_group: node
      placement: "0:0-5"

runner:
  synchronous: true
  experiment_name: rpent-libero-rl-qwen3.5-4b-ppo-8gpu-b48-1125-re
  output_dir: /mnt/public/yangke/logs/ppo-8gpu-b48-local
  seq_length: 262144
  resume_dir: null
  host_memory_logging:
    enabled: true
    warning_fraction: 0.8
    interval_s: 1.0
    pressure_interval_s: 0.25
    process_interval_s: 5.0
    pressure_process_interval_s: 1.0
    detail_interval_s: 30.0
    pressure_detail_interval_s: 5.0
    max_log_bytes: 67108864
  gpu_memory_logging:
    enabled: true
    nvml: true
    torch: true
    interval_s: 1.0
    output_dir: /mnt/public/yangke/logs/ppo-8gpu-b48-local/ppo-8gpu-b48-1125-re_memory

algorithm:
  # Match the historical b48 sampler, including its truncated token support.
  sampling_params:
    top_k: 20
    top_p: 0.95
    presence_penalty: 1.5

data:
  rollout_batch_size: 48
  train_data_paths:
    - /mnt/public/yangke/data/libero-rl-tasks/train.jsonl

tools:
  rpent:
    python: /mnt/public/yangke/envs/rpent/bin/python
    libero_config_path: /mnt/public/yangke/data/libero-standard-config
    env_gpus: [6, 7]
    # Six agents provide 48 episode slots, 24 per GPU.
    episodes_per_worker: 8
    # Limit cold starts to 12 across the node; permits are released after reset.
    max_env_initializations_per_worker: 2
    output_dir: /mnt/public/yangke/data/episodes-ppo-8gpu-b48-1125-re

rollout:
  gpu_memory_utilization: 0.5
  max_running_requests: 8
  # Pin each agent's episodes to the SGLang instance with the same rank.
  replica_affinity: true
  model:
    model_path: /mnt/public/yangke/models/Qwen3.5-4B
  sglang:
    # The historical run used the in-process engine, not the server default.
    backend_type: engine
    enable_shared_multi_modal_processor: false
